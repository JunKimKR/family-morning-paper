<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="masthead">
    <div class="mast-rule"></div>
    <a class="brand" href="{{ '/' | relative_url }}">우리집 아침신문</a>
    <p class="tagline">가족이 함께 읽는 경제 · 산업 · 정치 · 세계</p>
    <div class="mast-rule thin"></div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="foot">
    <div class="wrap">
      <p>이 신문은 AI(Claude)가 매일 아침 웹 기사를 찾아 정리합니다. 틀린 내용이 있을 수 있으니, 중요한 판단을 하기 전에는 출처 링크를 눌러 원문을 꼭 확인하세요.</p>
      <p>투자 권유가 아닙니다. 투자 판단과 그 결과는 본인 책임입니다.</p>
    </div>
  </footer>
</body>
</html>
