---
layout: default
---
<article class="issue">
  <p class="issue-meta">제{{ page.issue }}호 · {{ page.date | date: "%Y년 %-m월 %-d일" }} ({{ page.weekday }})</p>
  <h1 class="issue-title">{{ page.headline }}</h1>
  {{ content }}
</article>
<nav class="pager">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}">← 지난 호</a>{% else %}<span></span>{% endif %}
  <a href="{{ '/' | relative_url }}">전체 목록</a>
  {% if page.next %}<a href="{{ page.next.url | relative_url }}">다음 호 →</a>{% else %}<span></span>{% endif %}
</nav>
